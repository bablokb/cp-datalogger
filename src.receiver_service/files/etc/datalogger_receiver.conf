# --- global configuration   --------------------------------------------------

[GLOBAL]
debug:   0              ; 0|1

# --- configuration of receiver   ---------------------------------------------

[RECEIVER]
#port: 8888
#backlog: 5
#bufsize: 1024
tasks: noop       ; list of tasks (no quotes!). Implemented: noop, print, save

# --- configuration of print-task   -------------------------------------------

[PRINT]
filename: /dev/stderr    ; or /dev/stdout or whatever

# --- configuration of save-task   --------------------------------------------

[SAVE]
filename: /dev/stderr    ; or /dev/stdout or whatever
#endl: \n                ; add \n to end of line
